services:
  - type: web
    name: bharatfarm-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: OPENROUTER_API_KEY
        sync: false # Must be entered securely in the Render Dashboard
      - key: UNSPLASH_API_KEY
        sync: false # Optional — for crop images
      - key: PEXELS_API_KEY
        sync: false # Optional — for crop images
      - key: BHARATFARM_APK_URL
        sync: false # Production APK download URL (e.g. Google Drive / GitHub Releases link)
